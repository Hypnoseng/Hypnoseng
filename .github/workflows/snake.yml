
name: Generate Snake

on:
  # ทำงานอัตโนมัติทุก 24 ชั่วโมง
  schedule:
    - cron: "0 0 * * *"

  # สั่งรันเองได้
  workflow_dispatch:

  # ทำงานเมื่อมีการ Push ไปยัง main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. สร้าง SVG แอนิเมชันงู
      - name: Generate GitHub Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Hypnoseng
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. ปรับความเร็วทั้งสองธีมก่อนอัปโหลด
      - name: Set snake animation speed
        run: |
          sed -i 's/13500ms/4500ms/g' dist/github-contribution-grid-snake.svg
          sed -i 's/13500ms/4500ms/g' dist/github-contribution-grid-snake-dark.svg

      # 3. Push ไฟล์ที่แก้แล้วไปยัง output branch
      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
